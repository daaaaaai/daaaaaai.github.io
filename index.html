<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>daaaaaai.github.io</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f5f5f5;
      font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px;
    }

    h1 {
      font-size: 1.8rem;
      color: #333;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #888;
      margin-bottom: 48px;
      font-size: 0.95rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 800px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      padding: 28px 24px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.14);
    }

    .card-icon { line-height: 1; }

    .card-title {
      font-size: 1.15rem;
      font-weight: bold;
      color: #222;
    }

    .card-desc {
      font-size: 0.88rem;
      color: #777;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <h1>daaaaaai.github.io</h1>
  <p class="subtitle">Projects</p>

  <div class="grid">
    <a class="card" href="/browser_paint/">
      <div class="card-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="38" height="38">
        <circle cx="32"   cy="18"   r="10" fill="#f44336"/>
        <circle cx="45.3" cy="27.1" r="10" fill="#ffeb3b"/>
        <circle cx="40.5" cy="42.9" r="10" fill="#4caf50"/>
        <circle cx="23.5" cy="42.9" r="10" fill="#03a9f4"/>
        <circle cx="18.7" cy="27.1" r="10" fill="#9c27b0"/>
        <circle cx="32"   cy="32"   r="8"  fill="#fff"/>
      </svg></div>
      <div class="card-title">おえかきアプリ</div>
      <div class="card-desc">幼児向けブラウザお絵描きアプリ。色・ペンの太さを選んで自由に描ける。</div>
    </a>
    <a class="card" href="/color_chart/">
      <div class="card-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="38" height="38">
        <rect x="1"  y="1"  width="20" height="20" fill="#E8001C"/>
        <rect x="23" y="1"  width="20" height="20" fill="#FFE600"/>
        <rect x="45" y="1"  width="20" height="20" fill="#0057A8"/>
        <rect x="1"  y="23" width="20" height="20" fill="#FF6600"/>
        <rect x="23" y="23" width="20" height="20" fill="#00A651"/>
        <rect x="45" y="23" width="20" height="20" fill="#7B1FA2"/>
        <rect x="1"  y="45" width="20" height="20" fill="#FFFFFF"/>
        <rect x="23" y="45" width="20" height="20" fill="#9E9E9E"/>
        <rect x="45" y="45" width="20" height="20" fill="#1a1a1a"/>
      </svg></div>
      <div class="card-title">Color Chart</div>
      <div class="card-desc">ゲルハルト・リヒターの作品にインスパイアされたカラーチャートジェネレーター。</div>
    </a>
    <a class="card" href="/timer/">
      <div class="card-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="38" height="38">
        <circle cx="32" cy="34" r="26" fill="#1a1a1a" stroke="#eee" stroke-width="4"/>
        <line x1="32" y1="34" x2="20" y2="20" stroke="#eee" stroke-width="4" stroke-linecap="round"/>
        <line x1="32" y1="34" x2="32" y2="12" stroke="#eee" stroke-width="3" stroke-linecap="round"/>
        <circle cx="32" cy="34" r="3" fill="#eee"/>
        <rect x="28" y="5" width="8" height="5" rx="2" fill="#eee"/>
      </svg></div>
      <div class="card-title">タイマー</div>
      <div class="card-desc">シンプルなブラウザタイマー。時間切れ後もマイナス表示でカウントし続ける。</div>
    </a>
  </div>

</body>
</html>
